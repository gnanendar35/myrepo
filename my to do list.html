
<html lang="en">
<head>
<title>Professional To-Do List</title>

<style>
/* General Body Styling */
body {
    font-family: 'Arial', sans-serif;
    background-color: #f5f5f5;
    color: #333;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    text-align: center;
    min-height: 100vh;
    margin
}


.container {
    background-color:white;
    padding :40px 60px;
    margin: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    max-width: 600px;
    width: 100%;
    text-align: center;
    margin: left 400px;
}
h1 {
    margin-bottom: 30px;
    color: #2c3e50;
}

h2 {
    font-size: 1.2em;
    margin-bottom: 15px;
    color: #34495e;
    text-align: left;
}


ul {
    list-style: none;
    padding: 0;
    margin-bottom: 30px;

}

li {
    margin-bottom: 15px;
    display: flex;
    align-items: center;
}

input[type="checkbox"]:checked + label {
    text-decoration: line-through;
    color: #3498db;
}
}
</style>
</head>
<body>

<div class="container">
    <h1>My To-Do List</h1>

    <div class="section">
        <h2>Daily Tasks</h2>
        <ul>
            <li><input type="checkbox" id="task1"><label for="task1">Study HTML</label></li>
            <li><input type="checkbox" id="task2"><label for="task2">Read Books</label></li>
            <li><input type="checkbox" id="task3"><label for="task3">Play Cricket</label></li>
            <li><input type="checkbox" id="task4"><label for="task4">Learn Python</label></li>
        </ul>
    </div>

    <div class="section">
        <h2>Personal Tasks</h2>
        <ul>
            <li><input type="checkbox" id="task5"><label for="task5">Workout for 30 mins</label></li>
            <li><input type="checkbox" id="task6"><label for="task6">Read 20 pages of a book</label></li>
        </ul>
    </div>

    <div class="section">
        <h2>Daily Routine</h2>
        <ul>
            <li><input type="checkbox" id="task7"><label for="task7">Walking 50 mins</label></li>
        </ul>
    </div>
</div>

</body>
</html>
